<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            :root{
                --socialHW:44px;
            }

            body{
                margin:0;
                min-height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                padding:24px;
                box-sizing:border-box;
                background:url("images/nature_theme_bg.svg") center/cover no-repeat;
                font-family:Arial, Helvetica, sans-serif;
            }

            container{
                width:min(100%, 900px);
                padding:32px 28px;
                background:rgba(255, 248, 240, 0.82);
                border:1px solid rgba(255,255,255,0.7);
                border-radius:24px;
                box-shadow:0 18px 45px rgba(0,0,0,0.16);
                backdrop-filter:blur(6px);
            }

            @media (max-width: 600px) {
                body { padding: 16px; }
                container { padding: 20px 16px; }
                h2 { font-size: 1.1rem; }
                social img { height: 36px; width: 36px; }
            }

            h2{
                margin:0 0 18px;
                text-align:center;
                font-style:italic;
                color:#6b2f1d;
                line-height:1.6;
            }

            social{
                display:flex;
                justify-content:center;
                align-items:center;
                flex-wrap:wrap;
                gap:12px;
            }

            social img{
                height:var(--socialHW);
                width:var(--socialHW);
                object-fit:contain;
                transition:transform 0.2s ease;
            }

            social img:hover{
                transform:translateY(-3px) scale(1.05);
            }


            
        </style>
        

    </head>
    
    <body>
       <container> 
            <h2>our website is currently under construction. please visit after sometime while we prepare for you.</h2>
            <social>
                <facebook><a href="https://www.facebook.com/bikubara"><img src="src/social/facebook.png"></a></facebook>
                <instagram><a href="https://www.instagram.com/bikubara_forbidden_404_infj_d"><img src="src/social/instagram.png"></a></instagram>
                <x><a href="https://www.x.com/bikubara"><img src="src/social/x.png"></a></x>
                <linkdin><a href="https://www.linkedin.com/in/bikubara"><img src="src/social/linkedin.png"></a></linkdin>
                <youtube><a href="https://www.youtube.com/@bikubara"><img src="src/social/youtube.png"></a></youtube>  
            </social>
       </container>
    </body>
</html>
